[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vep-ml-benchmark"
version = "0.1.0"
description = "Variant Effect Prediction ML Benchmark Pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "requests>=2.28",
    "requests-cache>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "esm",
    "evo2",
]
cpu = [
    "torch>=2.0",
    "esm",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
all = [
    "torch>=2.0",
    "esm",
    "evo2",
    "pytest>=7.0",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[project.scripts]
vep-benchmark = "pipeline.main:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
